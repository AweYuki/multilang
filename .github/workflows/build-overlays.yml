name: Build HyperOS CN Language Overlays

on:
  push:
    branches:
      - main
    paths:
      - "overlays/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/build-overlays.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "overlays/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/build-overlays.yml"
  workflow_dispatch:
    inputs:
      string_source:
        description: "String source: repo (AI/repo overlays), xiaomi-eu, xiaomi-eu+repo, repo+xiaomi-eu, custom"
        type: choice
        options:
          - repo
          - xiaomi-eu
          - xiaomi-eu+repo
          - repo+xiaomi-eu
          - custom
        required: true
        default: "repo"
      xiaomi_eu_repo:
        description: "Xiaomi.eu XML Git repo URL (used when string_source includes xiaomi-eu)"
        required: false
        default: "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git"
        type: string
      version:
        description: "ROM version to build ('all' builds all non-empty versions)"
        type: choice
        options:
          - all
          - os4-a17
          - os3-a16
          - os3-a15
          - os2-a15
          - os2-a14
          - os1-a14
          - os1-a13
          - miui14
        required: true
        default: "all"
      language_mode:
        description: "Language mode: 'vi' (Vietnamese only) or 'all' (sync & build all languages)"
        type: choice
        options:
          - vi
          - all
        required: true
        default: "vi"
      overlays:
        description: "Comma-separated overlay folder names (leave empty to build all)"
        required: false
        default: ""
      compile_sdk:
        description: "Android compileSdk API level"
        required: false
        default: "35"
      create_release:
        description: "Create a GitHub Release with built APKs"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools and platform
        env:
          COMPILE_SDK: ${{ inputs.compile_sdk || '35' }}
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-${COMPILE_SDK}"

      - name: Prepare signing keystore (if secret configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p build
            echo "$KEYSTORE_BASE64" | base64 -d > build/release.keystore
            echo "KEYSTORE_PATH=build/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Sync Xiaomi.eu XML source (when needed)
        id: xiaomi_eu
        if: ${{ contains(inputs.string_source || 'repo', 'xiaomi-eu') }}
        env:
          LANGUAGE_MODE: ${{ inputs.language_mode || 'vi' }}
          TARGET_VERSION: ${{ (inputs.version && inputs.version != 'all') && inputs.version || 'os4-a17' }}
          XIAOMI_EU_REPO: ${{ inputs.xiaomi_eu_repo || 'https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git' }}
        run: |
          DEFAULT_REPO="https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git"
          if [ "$LANGUAGE_MODE" = "vi" ] && [ "$XIAOMI_EU_REPO" = "$DEFAULT_REPO" ] && [ -d "sources/xiaomi-eu/${TARGET_VERSION}" ]; then
            echo "Using pre-synced sources/xiaomi-eu/${TARGET_VERSION} from repo."
            echo "dir=sources/xiaomi-eu" >> "$GITHUB_OUTPUT"
          else
            SYNC_LANG="Vietnamese"
            if [ "$LANGUAGE_MODE" = "all" ]; then
              SYNC_LANG="all"
            fi
            python3 scripts/sync_xml.py \
              --repo-url "$XIAOMI_EU_REPO" \
              --overlays-dir /tmp/xiaomi-eu-overlays \
              --version "$TARGET_VERSION" \
              --lang "$SYNC_LANG"
            echo "dir=/tmp/xiaomi-eu-overlays" >> "$GITHUB_OUTPUT"
          fi

      - name: Build overlay APKs
        env:
          STRING_SOURCE: ${{ inputs.string_source || 'repo' }}
          XIAOMI_EU_DIR: ${{ steps.xiaomi_eu.outputs.dir || 'sources/xiaomi-eu' }}
          ROM_VERSION: ${{ inputs.version || 'all' }}
          LANGUAGE_MODE: ${{ inputs.language_mode || 'vi' }}
          ONLY_OVERLAYS: ${{ inputs.overlays || '' }}
          COMPILE_SDK: ${{ inputs.compile_sdk || '35' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ARGS=(--out dist --compile-sdk "$COMPILE_SDK" --version "$ROM_VERSION" --lang-mode "$LANGUAGE_MODE")
          case "$STRING_SOURCE" in
            repo)
              ARGS+=(--overlays-dir overlays)
              ;;
            xiaomi-eu)
              ARGS+=(--overlays-dir "$XIAOMI_EU_DIR")
              ;;
            xiaomi-eu+repo)
              ARGS+=(--overlays-dir "$XIAOMI_EU_DIR" --fallback-dir overlays)
              ;;
            repo+xiaomi-eu)
              ARGS+=(--overlays-dir overlays --fallback-dir "$XIAOMI_EU_DIR")
              ;;
            custom)
              ARGS+=(--overlays-dir sources/custom)
              ;;
          esac
          if [ -n "$ONLY_OVERLAYS" ]; then
            ARGS+=(--only "$ONLY_OVERLAYS")
          fi
          python3 scripts/build_overlays.py "${ARGS[@]}"

      - name: Verify built APKs
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          while IFS= read -r -d '' apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify "$apk"
          done < <(find dist -name '*.apk' -print0)

      - name: Upload overlay APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperos-cn-overlays-${{ inputs.version || 'all' }}-${{ inputs.language_mode || 'vi' }}
          path: dist/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.apk
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
