name: Build HyperOS CN Language Overlays

on:
  push:
    branches:
      - main
    paths:
      - "overlays/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/build-overlays.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "overlays/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/build-overlays.yml"
  workflow_dispatch:
    inputs:
      string_source:
        description: "String source: repo (AI/repo overlays), xiaomi-eu, xiaomi-eu+repo, repo+xiaomi-eu, custom"
        type: choice
        options:
          - repo
          - xiaomi-eu
          - xiaomi-eu+repo
          - repo+xiaomi-eu
          - custom
        required: true
        default: "repo"
      xiaomi_eu_repo:
        description: "Xiaomi.eu XML Git repo URL (used when string_source includes xiaomi-eu)"
        required: false
        default: "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git"
        type: string
      version:
        description: "ROM version to build ('all' builds all non-empty versions)"
        type: choice
        options:
          - all
          - os4-a17
          - os3-a16
          - os3-a15
          - os2-a15
          - os2-a14
          - os1-a14
          - os1-a13
          - miui14
        required: true
        default: "all"
      language_mode:
        description: "Language mode: 'vi' (Vietnamese), 'en' (English), or 'all' (sync & build all languages)"
        type: choice
        options:
          - vi
          - en
          - all
        required: true
        default: "vi"
      overlays:
        description: "Comma-separated overlay folder names (leave empty to build all)"
        required: false
        default: ""
      compile_sdk:
        description: "Android compileSdk API level"
        required: false
        default: "35"
      create_release:
        description: "Create a GitHub Release with built APKs"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools and platform
        env:
          COMPILE_SDK: ${{ inputs.compile_sdk || '35' }}
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-${COMPILE_SDK}"

      - name: Prepare signing keystore (if secret configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p build
            echo "$KEYSTORE_BASE64" | base64 -d > build/release.keystore
            echo "KEYSTORE_PATH=build/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Sync Xiaomi.eu XML source (when needed)
        id: xiaomi_eu
        if: ${{ contains(inputs.string_source || 'repo', 'xiaomi-eu') }}
        env:
          LANGUAGE_MODE: ${{ inputs.language_mode || 'vi' }}
          TARGET_VERSION: ${{ inputs.version || 'all' }}
          XIAOMI_EU_REPO: ${{ inputs.xiaomi_eu_repo || 'https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git' }}
        run: |
          set -euo pipefail
          DEFAULT_REPO="https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git"
          if [ "$LANGUAGE_MODE" = "vi" ] && [ "$XIAOMI_EU_REPO" = "$DEFAULT_REPO" ] && { [ "$TARGET_VERSION" = "all" ] || [ -d "sources/xiaomi-eu/${TARGET_VERSION}" ]; }; then
            echo "Using pre-synced sources/xiaomi-eu (${TARGET_VERSION}) from repo."
            echo "dir=sources/xiaomi-eu" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$LANGUAGE_MODE" in
            vi) SYNC_LANG="Vietnamese" ;;
            en) SYNC_LANG="English" ;;
            all) SYNC_LANG="all" ;;
          esac

          sync_ver() {
            local ver="$1"
            local repo="$2"
            local variants="$3"
            echo "Syncing ${ver} (${SYNC_LANG}) from ${repo} [${variants}]..."
            python3 scripts/sync_xml.py \
              --repo-url "$repo" \
              --overlays-dir /tmp/xiaomi-eu-overlays \
              --version "$ver" \
              --variants "$variants" \
              --lang "$SYNC_LANG"
          }

          if [ "$XIAOMI_EU_REPO" != "$DEFAULT_REPO" ]; then
            ver="${TARGET_VERSION}"
            [ "$ver" = "all" ] && ver="os4-a17"
            sync_ver "$ver" "$XIAOMI_EU_REPO" "qcom-sdk37,mtk-sdk37"
          else
            if { [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "miui14" ]; } && [ "$SYNC_LANG" != "English" ]; then
              sync_ver "miui14" "https://github.com/butinhi/MIUI-14-XML-Vietnamese.git" "."
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os1-a13" ]; then
              sync_ver "os1-a13" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-1.0-XML-Global.git" "qcom-sdk33,mtk-sdk33"
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os1-a14" ]; then
              sync_ver "os1-a14" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-1.0-XML-Global.git" "qcom-sdk34,mtk-sdk34"
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os2-a14" ]; then
              sync_ver "os2-a14" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-2.0-XML-Global.git" "qcom-sdk34,mtk-sdk34"
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os2-a15" ]; then
              sync_ver "os2-a15" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-2.0-XML-Global.git" "qcom-sdk35,mtk-sdk35"
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os3-a15" ]; then
              sync_ver "os3-a15" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-3.0-XML-Global.git" "qcom-sdk35"
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os3-a16" ]; then
              sync_ver "os3-a16" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-3.0-XML-Global.git" "qcom-sdk36,mtk-sdk36"
            fi
            if [ "$TARGET_VERSION" = "all" ] || [ "$TARGET_VERSION" = "os4-a17" ]; then
              sync_ver "os4-a17" "https://github.com/ingbrzy/Xiaomi.eu-HyperOS-4.0-XML-Global.git" "qcom-sdk37,mtk-sdk37"
            fi
          fi
          echo "dir=/tmp/xiaomi-eu-overlays" >> "$GITHUB_OUTPUT"

      - name: Build overlay APKs
        env:
          STRING_SOURCE: ${{ inputs.string_source || 'repo' }}
          XIAOMI_EU_DIR: ${{ steps.xiaomi_eu.outputs.dir || 'sources/xiaomi-eu' }}
          ROM_VERSION: ${{ inputs.version || 'all' }}
          LANGUAGE_MODE: ${{ inputs.language_mode || 'vi' }}
          ONLY_OVERLAYS: ${{ inputs.overlays || '' }}
          COMPILE_SDK: ${{ inputs.compile_sdk || '35' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ARGS=(--out dist --compile-sdk "$COMPILE_SDK" --version "$ROM_VERSION" --lang-mode "$LANGUAGE_MODE")
          case "$STRING_SOURCE" in
            repo)
              ARGS+=(--overlays-dir overlays)
              ;;
            xiaomi-eu)
              ARGS+=(--overlays-dir "$XIAOMI_EU_DIR")
              ;;
            xiaomi-eu+repo)
              ARGS+=(--overlays-dir "$XIAOMI_EU_DIR" --fallback-dir overlays)
              ;;
            repo+xiaomi-eu)
              ARGS+=(--overlays-dir overlays --fallback-dir "$XIAOMI_EU_DIR")
              ;;
            custom)
              ARGS+=(--overlays-dir sources/custom)
              ;;
          esac
          if [ -n "$ONLY_OVERLAYS" ]; then
            ARGS+=(--only "$ONLY_OVERLAYS")
          fi
          python3 scripts/build_overlays.py "${ARGS[@]}"

      - name: Verify built APKs
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          while IFS= read -r -d '' apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify "$apk"
          done < <(find dist -name '*.apk' -print0)

      - name: Upload overlay APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperos-cn-overlays-${{ inputs.version || 'all' }}-${{ inputs.language_mode || 'vi' }}
          path: dist/**/*.apk
          if-no-files-found: error

      - name: Prepare release assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          LANGUAGE_MODE: ${{ inputs.language_mode || 'vi' }}
        run: |
          mkdir -p release_assets
          ver_count=$(find dist -mindepth 1 -maxdepth 1 -type d | wc -l)
          for ver_dir in dist/*/; do
            [ -d "$ver_dir" ] || continue
            ver=$(basename "$ver_dir")
            (cd "$ver_dir" && zip -q -r "../../release_assets/hyperos-cn-overlays-${ver}-${LANGUAGE_MODE}.zip" ./*.apk)
            if [ "$ver_count" -eq 1 ]; then
              cp "$ver_dir"*.apk release_assets/
            fi
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0} ({1} / {2})', github.run_number, inputs.version || 'all', inputs.language_mode || 'vi') }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
