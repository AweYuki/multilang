name: Build HyperOS CN Language Overlays

on:
  push:
    branches:
      - main
    paths:
      - "overlays/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/build-overlays.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "overlays/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/build-overlays.yml"
  workflow_dispatch:
    inputs:
      language_mode:
        description: "Language mode: 'vi' (Vietnamese only) or 'all' (sync & build all languages)"
        type: choice
        options:
          - vi
          - all
        required: true
        default: "vi"
      overlays:
        description: "Comma-separated overlay folder names (leave empty to build all)"
        required: false
        default: ""
      compile_sdk:
        description: "Android compileSdk API level"
        required: false
        default: "35"
      create_release:
        description: "Create a GitHub Release with built APKs"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools and platform
        env:
          COMPILE_SDK: ${{ inputs.compile_sdk || '35' }}
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-${COMPILE_SDK}"

      - name: Prepare signing keystore (if secret configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p build
            echo "$KEYSTORE_BASE64" | base64 -d > build/release.keystore
            echo "KEYSTORE_PATH=build/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Sync all languages from Xiaomi.eu (when language_mode is all)
        if: ${{ (inputs.language_mode || 'vi') == 'all' }}
        run: python3 scripts/sync_xml.py --lang all

      - name: Build overlay APKs
        env:
          LANGUAGE_MODE: ${{ inputs.language_mode || 'vi' }}
          ONLY_OVERLAYS: ${{ inputs.overlays || '' }}
          COMPILE_SDK: ${{ inputs.compile_sdk || '35' }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ARGS=(--out dist --compile-sdk "$COMPILE_SDK" --lang-mode "$LANGUAGE_MODE")
          if [ -n "$ONLY_OVERLAYS" ]; then
            ARGS+=(--only "$ONLY_OVERLAYS")
          fi
          python3 scripts/build_overlays.py "${ARGS[@]}"

      - name: Verify built APKs
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          for apk in dist/*.apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify "$apk"
          done

      - name: Upload overlay APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperos-cn-overlays-${{ inputs.language_mode || 'vi' }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
